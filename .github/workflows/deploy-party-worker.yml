name: Deploy party worker

# The listen-together Durable Object lives in its own worker (yvxi-party),
# separate from the Pages project. Pages auto-deploys from main via the
# Cloudflare Git integration; this worker has no git integration, so it must
# be deployed explicitly. Run this when workers/party-room.ts changes — or
# trigger it manually from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - 'workers/party-room.ts'
      - 'wrangler-party.jsonc'
      - '.github/workflows/deploy-party-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 'true' only when the repo secret exists — gates the deploy step.
      CLOUDFLARE_API_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check party worker
        run: npx tsc -p workers/tsconfig.json

      - name: Run DO integration tests
        run: npm test

      - name: Dry-run bundle
        run: npx wrangler deploy --config wrangler-party.jsonc --dry-run --outdir dist-worker

      # Skips cleanly until the CLOUDFLARE_API_TOKEN repo secret is set, so
      # the first push isn't a red X. Add the secret to go live.
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN_SET == 'true' }}
        run: npx wrangler deploy --config wrangler-party.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy skipped (secret missing)
        if: ${{ env.CLOUDFLARE_API_TOKEN_SET != 'true' }}
        run: echo "CLOUDFLARE_API_TOKEN secret not set — add it in repo Settings → Secrets → Actions to enable deploys."
