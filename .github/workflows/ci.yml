name: Blog and origin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=1024
      UV_THREADPOOL_SIZE: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install graph renderer
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npm run build
      - run: npm run check:site
