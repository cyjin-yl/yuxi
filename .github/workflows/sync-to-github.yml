name: Legacy Gitea mirror (manual)

# OVH is the production origin. A stale Gitea checkout must never overwrite
# newer GitHub articles or trigger a deployment merely by receiving a push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward GitHub mirror
        env:
          MIRROR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          auth=$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w 0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/cyjin-yl/yuxi.git HEAD:main
